[package]
name = "vettr"
version = "0.0.1"
edition = "2021"
description = "Agent-first review IDE (pronounced \"vetter\")"
license = "UNLICENSED"
publish = false

[lib]
name = "vettr"
path = "src/lib.rs"

[[bin]]
name = "vettr"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
notify = "8"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rfd = "0.17"
keyring = "4"
ureq = "3"
dirs = "7"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
libc = "0.2"
shell-words = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
